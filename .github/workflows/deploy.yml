name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Un solo deploy a la vez; los siguientes esperan en cola (no se cancelan a medias)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # crear tag + GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare temp workspace
        run: |
          mkdir -p /tmp/site
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            ./ /tmp/site/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json

      - name: Optimize images before deploy
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends imagemagick
          cd /tmp/site
          if [ -d assets ]; then
            find assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -exec mogrify -strip -interlace Plane -quality 82 {} +
            find assets -type f -iname '*.png' -exec mogrify -strip -define png:compression-level=9 -define png:compression-filter=5 -define png:exclude-chunk=all {} +
            find assets -type f -iname '*.webp' -exec mogrify -strip -quality 82 {} +
          fi

      - name: Install dependencies
        working-directory: /tmp/site
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build (minify JS)
        working-directory: /tmp/site
        run: npm run build

      - name: Inject Sentry DSN and release
        working-directory: /tmp/site
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          values = {
              "__SENTRY_DSN__": os.environ.get("SENTRY_DSN", "").strip(),
              "__SENTRY_RELEASE__": os.environ.get("SENTRY_RELEASE", "").strip(),
          }

          html = Path("index.html")
          if not html.is_file():
              print(f"No se encontró {html.resolve()}.", file=sys.stderr)
              sys.exit(1)

          content = html.read_text(encoding="utf-8")
          for placeholder, value in values.items():
              if not value:
                  print(f"Valor para {placeholder} no definido", file=sys.stderr)
                  sys.exit(1)
              if placeholder not in content:
                  print(f"Placeholder {placeholder} no encontrado en index.html", file=sys.stderr)
                  sys.exit(1)
              content = content.replace(placeholder, value)

          # Cache busting: los nombres de JS/CSS no llevan hash, así que se versiona
          # la URL con el SHA del commit. Así el navegador nunca reutiliza una copia
          # vieja (incluidas las que se cachearon antes como `immutable`).
          version = values["__SENTRY_RELEASE__"][:12]
          content, count = re.subn(
              r'((?:src|href|data-sentry-src)=")((?:dist|styles)/[^"?#]+\.(?:js|css))"',
              rf'\1\2?v={version}"',
              content,
          )
          if count == 0:
              print("No se encontraron assets locales para versionar", file=sys.stderr)
              sys.exit(1)

          html.write_text(content, encoding="utf-8")
          print(f"SENTRY_DSN y SENTRY_RELEASE inyectados; {count} URLs versionadas con ?v={version}")
          PY

      - name: Validate HTML
        working-directory: /tmp/site
        run: npm run validate:html

      - name: Check links
        working-directory: /tmp/site
        run: npm run check:links

      - name: Run tests
        working-directory: /tmp/site
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # La action de Sentry corre en un contenedor Docker que solo monta el
      # workspace: /tmp/site no existe ahí. Se copia dist/ al workspace.
      - name: Stage bundles for Sentry
        run: |
          rm -rf .sentry-dist
          cp -R /tmp/site/dist .sentry-dist
          rm -rf .sentry-dist/vendor

      - name: Create Sentry release and upload sourcemaps
        # Se ejecuta desde el root del repo para que .git esté disponible para set_commits
        uses: getsentry/action-release@d55c8c3b7375607e972b710f12926b676d89d7d2 # v3.8.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: ${{ github.sha }}
          projects: ${{ vars.SENTRY_PROJECT }}
          sourcemaps: ./.sentry-dist
          inject: true
          url_prefix: '~/dist'
          finalize: true
          set_commits: auto
          environment: ${{ vars.SENTRY_ENVIRONMENT }}

      # La action no falla si no encuentra archivos; se verifica que los Debug IDs
      # se inyectaron y se publican esos mismos JS para que coincidan con los maps.
      - name: Verify Sentry Debug IDs and publish injected bundles
        run: |
          missing=0
          for f in .sentry-dist/*.js; do
            # sentry-cli añade una línea final "//# debugId=<uuid>"; buscar solo
            # "debugId" daría falso positivo (el propio SDK contiene esa cadena).
            if ! grep -qE '^//# debugId=[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' "$f"; then
              echo "Sin Debug ID: $f" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sentry no procesó los bundles; no se publican sin sourcemaps." >&2
            exit 1
          fi
          cp .sentry-dist/*.js /tmp/site/dist/
          echo "Debug IDs inyectados en: $(ls .sentry-dist/*.js | xargs -n1 basename | tr '\n' ' ')"

      # Ningún archivo lleva hash en el nombre, así que nada se marca "immutable":
      # el navegador debe poder ver la versión nueva tras un deploy.
      - name: Deploy static assets to S3 (7 days cache)
        run: |
          cd /tmp/site
          aws s3 sync . s3://${{ vars.AWS_S3_BUCKET }} --delete \
            --exclude "*" \
            --include "assets/*" \
            --include "docs/*" \
            --include "dist/vendor/*" \
            --cache-control "public,max-age=604800"

      - name: Deploy JS, CSS and content to S3 (short cache)
        run: |
          cd /tmp/site
          aws s3 sync . s3://${{ vars.AWS_S3_BUCKET }} --delete \
            --exclude "*" \
            --include "dist/*" \
            --exclude "dist/vendor/*" \
            --exclude "dist/*.map" \
            --include "styles/*" \
            --include "content/*" \
            --cache-control "public,max-age=300,must-revalidate"

      # Los sourcemaps solo se publican en Sentry, no en el sitio
      - name: Remove sourcemaps from S3
        run: |
          aws s3 rm s3://${{ vars.AWS_S3_BUCKET }}/dist/ --recursive \
            --exclude "*" --include "*.map"
          aws s3 rm s3://${{ vars.AWS_S3_BUCKET }}/scripts/sentry.js || true

      - name: Deploy HTML with short cache
        run: |
          cd /tmp/site
          aws s3 sync . s3://${{ vars.AWS_S3_BUCKET }} --delete \
            --exclude "*" \
            --include "index.html" \
            --cache-control "public,max-age=60"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Generate Next Version
        id: version
        run: |
          # Tag semver más alto del repo (no solo los alcanzables desde main:
          # git describe devolvía v0.0.2 y cada deploy reescribía v0.0.3)
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)
          latest_tag=${latest_tag:-v0.0.0}
          echo "Latest tag: $latest_tag"

          # Remove 'v' prefix
          version=${latest_tag#v}

          # Split into parts (assuming X.Y.Z)
          IFS='.' read -r major minor patch <<< "$version"

          # Increment patch version
          new_patch=$((patch + 1))
          new_tag="v$major.$minor.$new_patch"

          echo "New version: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
