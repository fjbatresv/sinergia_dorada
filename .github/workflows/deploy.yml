name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare temp workspace
        run: |
          mkdir -p /tmp/site
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            ./ /tmp/site/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json

      - name: Optimize images before deploy
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends imagemagick
          cd /tmp/site
          if [ -d assets ]; then
            find assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -exec mogrify -strip -interlace Plane -quality 82 {} +
            find assets -type f -iname '*.png' -exec mogrify -strip -define png:compression-level=9 -define png:compression-filter=5 -define png:exclude-chunk=all {} +
            find assets -type f -iname '*.webp' -exec mogrify -strip -quality 82 {} +
          fi

      - name: Install dependencies
        working-directory: /tmp/site
        run: npm ci --registry=https://registry.npmjs.org

      - name: Download Sentry bundle fallback
        working-directory: /tmp/site
        run: |
          mkdir -p assets
          curl -sfL https://browser.sentry-cdn.com/7.120.1/bundle.tracing.replay.min.js -o assets/sentry.bundle.tracing.replay.min.js

      - name: Build (minify JS)
        working-directory: /tmp/site
        run: npm run build

      - name: Inject Sentry release
        working-directory: /tmp/site
        env:
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          release = os.environ.get("SENTRY_RELEASE", "").strip()
          if not release:
              print("SENTRY_RELEASE no definido", file=sys.stderr)
              sys.exit(1)

          js = Path("scripts/sentry.js")
          if not js.is_file():
              print(f"No se encontró {js.resolve()}. Verifica la ruta del archivo.", file=sys.stderr)
              sys.exit(1)

          content = js.read_text(encoding="utf-8")
          content = content.replace("__SENTRY_RELEASE__", release)
          js.write_text(content, encoding="utf-8")
          print(f"SENTRY_RELEASE inyectado en {js}")
          PY
      - name: Validate HTML
        working-directory: /tmp/site
        run: npm run validate:html

      - name: Check links
        working-directory: /tmp/site
        run: npm run check:links

      - name: Run tests
        working-directory: /tmp/site
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create Sentry release and upload sourcemaps
        # Se ejecuta desde el root del repo para que .git esté disponible para set_commits
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          version: ${{ github.sha }}
          projects: ${{ vars.SENTRY_PROJECT }}
          sourcemaps: /tmp/site/scripts
          url_prefix: '~/scripts'
          finalize: true
          set_commits: auto
          environment: ${{ vars.SENTRY_ENVIRONMENT }}

      - name: Deploy assets to S3 (long cache)
        run: |
          cd /tmp/site
          aws s3 sync . s3://${{ vars.AWS_S3_BUCKET }} --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude ".husky/*" \
            --exclude ".npmrc" \
            --exclude ".prettierignore" \
            --exclude ".prettierrc" \
            --exclude ".htmlvalidate.json" \
            --exclude ".DS_Store" \
            --exclude "coverage/*" \
            --exclude "README.md" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "eslint.config.js" \
            --exclude "lint-staged.config.mjs" \
            --exclude "vitest.config.js" \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy HTML with short cache
        run: |
          cd /tmp/site
          aws s3 sync . s3://${{ vars.AWS_S3_BUCKET }} --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=60"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*.html" "/assets/*" "/styles/*" "/scripts/*"

      - name: Generate Next Version
        id: version
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest_tag"

          # Remove 'v' prefix
          version=${latest_tag#v}

          # Split into parts (assuming X.Y.Z)
          IFS='.' read -r major minor patch <<< "$version"

          # Increment patch version
          new_patch=$((patch + 1))
          new_tag="v$major.$minor.$new_patch"

          echo "New version: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
