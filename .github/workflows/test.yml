name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Sentry bundle fallback
        run: |
          mkdir -p assets
          curl -sfL https://browser.sentry-cdn.com/7.120.1/bundle.tracing.replay.min.js -o assets/sentry.bundle.tracing.replay.min.js

      - name: Run lint and formatting checks
        run: npm run lint && npm run format:check

      - name: Validate HTML
        run: npm run validate:html

      - name: Check links
        run: npm run check:links

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Sentry bundle fallback
        run: |
          mkdir -p assets
          curl -sfL https://browser.sentry-cdn.com/7.120.1/bundle.tracing.replay.min.js -o assets/sentry.bundle.tracing.replay.min.js

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Accessibility smoke test
        run: npm run test:axe

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
