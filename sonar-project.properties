# Configuración de SonarCloud
sonar.projectKey=fjbatresv_sinergia_dorada
sonar.organization=fjbatresv
sonar.projectName=sinergia_dorada
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Rutas a analizar
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/assets/**,**/.github/**

# Tests y cobertura
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.spec.js
# sentry.js/sentry-sdk.js: solo inicialización del SDK, sin lógica testeable
sonar.coverage.exclusions=tests/**,**/*.config.js,**/dist/**,**/node_modules/**,**/coverage/**,scripts/copy-vendor.js,scripts/sentry.js,scripts/sentry-sdk.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.file.suffixes=.js
